alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack-#k4-l3b-alerts
    owner: student-2A202602380
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack-#k4-l3b-alerts
    owner: student-2A202602380
    runbook: docs/alerts.md#alert-2
  - name: CostSpike
    severity: warning
    condition: total(cost_usd) > 2.5
    duration: 15m
    type: symptom-based
    channel: slack-#k4-l3b-alerts
    owner: student-2A202602380
    runbook: docs/alerts.md#alert-3
